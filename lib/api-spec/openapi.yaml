openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Volleyball player and match management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: players
    description: Player records and leaderboard
  - name: matches
    description: Match setup and rosters
paths:
  /auth/me:
    get:
      operationId: getAuthViewer
      tags: [players]
      responses:
        "200":
          description: Verified session and application permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthViewer"
  /admin/accounts:
    get:
      operationId: listAdminAccounts
      tags: [players]
      responses:
        "200":
          description: Accounts that have signed into this app
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppAccount"
  /admin/accounts/{accountId}:
    parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateAccountLink
      tags: [players]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountLinkUpdate"
      responses:
        "200":
          description: Linked account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppAccount"
  /admin/admin-access:
    get:
      operationId: listAdminAccess
      tags: [players]
      responses:
        "200":
          description: Administrator email grants including future sign-ins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAccess"
    post:
      operationId: grantAdminAccess
      tags: [players]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAccessInput"
      responses:
        "201":
          description: Administrator access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccess"
  /admin/admin-access/{email}:
    parameters:
      - name: email
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: revokeAdminAccess
      tags: [players]
      responses:
        "204":
          description: Administrator access revoked
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /players:
    get:
      operationId: listPlayers
      tags: [players]
      summary: List all players
      responses:
        "200":
          description: Players ordered by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
    post:
      operationId: createPlayer
      tags: [players]
      summary: Create a player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerInput"
      responses:
        "201":
          description: Created player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          description: Invalid player details
  /players/{playerId}:
    parameters:
      - name: playerId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getPlayer
      tags: [players]
      summary: Get a player
      responses:
        "200":
          description: Player record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          description: Player not found
    patch:
      operationId: updatePlayer
      tags: [players]
      summary: Update a player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerUpdate"
      responses:
        "200":
          description: Updated player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          description: Invalid player details
        "404":
          description: Player not found
    delete:
      operationId: deletePlayer
      tags: [players]
      summary: Delete a player
      responses:
        "204":
          description: Player deleted
        "404":
          description: Player not found
  /profile/preferences:
    patch:
      operationId: updateOwnPreferences
      tags: [players]
      summary: Update preferred positions for the signed-in account's linked player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerPreferencesUpdate"
      responses:
        "200":
          description: Updated linked player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          description: Invalid ranked positions
        "401":
          description: Sign-in required
        "403":
          description: A linked player profile is required
        "404":
          description: Linked player profile not found
  /players/{playerId}/elo-history:
    parameters:
      - name: playerId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getPlayerEloHistory
      tags: [players]
      summary: Get a player's ELO audit history (admin only)
      responses:
        "200":
          description: ELO changes ordered from oldest to newest
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EloHistoryEntry"
        "404":
          description: Player not found
        "401":
          description: Sign in as an administrator to access ELO audit history
        "403":
          description: Administrator access required
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [players]
      summary: List the public top five established players in rating order
      responses:
        "200":
          description: Public top five established players in existing rating order, without numeric ratings or preferences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"
  /rank-tiers:
    get:
      operationId: getRankTiers
      tags: [players]
      summary: Get the configured competitive rank tier ranges
      responses:
        "200":
          description: Tier ranges derived from the authoritative ELO rank thresholds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RankTierRange"
  /matches:
    get:
      operationId: listMatches
      tags: [matches]
      summary: List matches and team rosters
      responses:
        "200":
          description: Matches ordered by creation time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"
    post:
      operationId: createMatch
      tags: [matches]
      summary: Create an upcoming match
      description: Requires 12, 13, or 14 distinct players with exact assigned roles. Six-player teams have 1 Setter, 2 Outside Hitters, 2 Middle Blockers, and 1 Opposite. Seven-player teams have that formation plus 1 Libero. Assigned roles may be Preferred or Filled when the player's profile does not include the role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchInput"
      responses:
        "201":
          description: Created match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "400":
          description: Invalid match rosters
  /matches/{matchId}:
    parameters:
      - name: matchId
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getMatch
      tags: [matches]
      summary: Get a match and its rosters
      responses:
        "200":
          description: Match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "404":
          description: Match not found
    patch:
      operationId: updateMatchDraft
      tags: [matches]
      summary: Update an unplayed draft in place (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchInput"
      responses:
        "200":
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "400":
          description: Invalid roster
        "403":
          description: Admin required
        "404":
          description: Match not found
        "409":
          description: Match already has result history
    delete:
      operationId: deleteMatchDraft
      tags: [matches]
      summary: Delete a match, reversing its completed result first (admin only)
      description: Atomically reverses completed ELO, counters and priority before removing the match and its associated audit rows. Already-reversed results are not reversed twice. Later dependent results must be reopened first.
      parameters:
        - name: expectedStatus
          in: query
          required: false
          description: Reject deletion if the status changed after the user confirmed.
          schema:
            type: string
            enum: [upcoming, completed]
      responses:
        "204":
          description: Match and associated rows deleted after any required reversal
        "403":
          description: Admin required
        "404":
          description: Match not found
        "409":
          description: A later result depends on this match, or its result history cannot be safely reversed
  /matches/{matchId}/result:
    parameters:
      - name: matchId
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: submitMatchResult
      tags: [matches]
      summary: Submit a final score and update player ELO
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchResultInput"
      responses:
        "200":
          description: Completed match with the ELO changes from this result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "400":
          description: Invalid score
        "404":
          description: Match not found
        "409":
          description: Match is already completed or cannot be scored
  /matches/{matchId}/reopen:
    parameters:
      - name: matchId
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: reopenMatchResult
      tags: [matches]
      summary: Reverse a match result and reopen score entry
      responses:
        "200":
          description: Upcoming match after reversing its ELO changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "404":
          description: Match not found
        "409":
          description: Result cannot be reversed because a later match depends on it
components:
  schemas:
    LeaderboardEntry:
      type: object
      additionalProperties: false
      required: [id, placement, name, mostPlayedPosition, tier]
      properties:
        id:
          type: integer
        placement:
          type: integer
          minimum: 1
          maximum: 5
        name:
          type: string
        mostPlayedPosition:
          type: ["string", "null"]
          enum: [Setter, Outside Hitter, Middle Blocker, Opposite, Libero, null]
        tier:
          $ref: "#/components/schemas/CompetitiveTier"
    CompetitiveTier:
      type: string
      enum: [Iron, Bronze, Silver, Gold, Platinum, Diamond, Masters]
    RankTierRange:
      type: object
      additionalProperties: false
      required: [tier, minElo, maxElo]
      properties:
        tier:
          $ref: "#/components/schemas/CompetitiveTier"
        minElo:
          type: integer
          minimum: 0
        maxElo:
          type: ["integer", "null"]
          minimum: 0
          description: Null indicates that the tier has no configured upper bound.
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Position:
      type: string
      enum:
        - Setter
        - Outside Hitter
        - Middle Blocker
        - Opposite
        - Libero
    Player:
      type: object
      required: [id, name, positions, elo, rank, matchesPlayed, provisional, eloPublic, createdAt, preferencesConfirmed, preferredRolePriority, prioritySince]
      properties:
        id:
          type: integer
        name:
          type: string
        positions:
          type: array
          items:
            $ref: "#/components/schemas/Position"
        elo:
          type: ["integer", "null"]
          description: Exact rating is visible only to the linked player owner and admins; null for all other viewers regardless of public leaderboard opt-in.
        eloPublic:
          type: boolean
        rank:
          $ref: "#/components/schemas/RankLabel"
        matchesPlayed:
          type: integer
          minimum: 0
          readOnly: true
        provisional:
          type: boolean
          description: True below ten completed progression matches, including zero.
        createdAt:
          type: string
          format: date-time
        preferencesConfirmed:
          type: boolean
        preferredRolePriority:
          type: boolean
        prioritySince:
          type: ["string", "null"]
          format: date-time
    PlayerInput:
      type: object
      required: [name, positions]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        positions:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Position"
        elo:
          type: integer
          default: 800
          minimum: 0
        eloPublic:
          type: boolean
          default: false
    PlayerUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        positions:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          description: Linked non-admin players must provide at least three preferences; admin edits retain the existing one-to-five range.
          items:
            $ref: "#/components/schemas/Position"
        elo:
          type: integer
          minimum: 0
        eloPublic:
          type: boolean
    PlayerPreferencesUpdate:
      type: object
      required: [positions]
      additionalProperties: false
      properties:
        positions:
          type: array
          minItems: 3
          maxItems: 5
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Position"
    MatchStatus:
      type: string
      enum: [upcoming, completed]
    Match:
      type: object
      required: [id, teamA, teamB, scoreA, scoreB, status, winner, completedAt, createdAt, eloChanges]
      properties:
        draftEditable:
          type: boolean
          description: Upcoming roster has never had a result or completion event.
        matchDate:
          type: ["string", "null"]
          format: date
          description: Scheduled local calendar date; null for legacy rosters.
        id:
          type: integer
        teamA:
          type: array
          items:
            $ref: "#/components/schemas/MatchPlayerSnapshot"
        teamB:
          type: array
          items:
            $ref: "#/components/schemas/MatchPlayerSnapshot"
        scoreA:
          type: ["integer", "null"]
        scoreB:
          type: ["integer", "null"]
        status:
          $ref: "#/components/schemas/MatchStatus"
        winner:
          type: ["string", "null"]
          enum: ["Team A", "Team B", null]
        completedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        eloChanges:
          type: array
          description: Admin-only result audit detail; always empty for non-admin viewers.
          items:
            $ref: "#/components/schemas/EloHistoryEntry"
    MatchPlayerSnapshot:
      type: object
      description: Immutable played roster. Non-admin responses redact elo and rank and omit rating progression metadata. Stored snapshots are never rewritten.
      required: [id, name, positions, elo]
      properties:
        id:
          type: integer
        name:
          type: string
        positions:
          type: array
          items:
            $ref: "#/components/schemas/Position"
        elo:
          type: ["integer", "null"]
          description: Only administrators receive snapshot ratings.
        rank:
          $ref: "#/components/schemas/RankLabel"
        matchesPlayed:
          type: integer
          minimum: 0
        provisional:
          type: boolean
        createdAt:
          type: string
          format: date-time
        preferencesConfirmed:
          type: boolean
        preferredRolePriority:
          type: boolean
        prioritySince:
          type: ["string", "null"]
          format: date-time
        assignedPosition:
          $ref: "#/components/schemas/Position"
        assignmentStatus:
          type: string
          enum: [preferred, filled]
        preferenceRank:
          type: ["integer", "null"]
    MatchInput:
      type: object
      required:
        - teamAPlayerIds
        - teamBPlayerIds
        - teamAAssignments
        - teamBAssignments
      properties:
        matchDate:
          type: string
          format: date
          description: Optional for existing callers; the creation UI requires a date.
        teamAPlayerIds:
          type: array
          minItems: 6
          maxItems: 7
          uniqueItems: true
          items:
            type: integer
        teamBPlayerIds:
          type: array
          minItems: 6
          maxItems: 7
          uniqueItems: true
          items:
            type: integer
        teamAAssignments:
          type: array
          minItems: 6
          maxItems: 7
          items:
            $ref: "#/components/schemas/MatchPlayerAssignment"
        teamBAssignments:
          type: array
          minItems: 6
          maxItems: 7
          items:
            $ref: "#/components/schemas/MatchPlayerAssignment"
    MatchPlayerAssignment:
      type: object
      required: [playerId, assignedPosition]
      properties:
        playerId:
          type: integer
        assignedPosition:
          $ref: "#/components/schemas/Position"
        assignmentStatus:
          type: string
          enum: [preferred, filled]
        preferenceRank:
          type: ["integer", "null"]
    MatchResultInput:
      type: object
      required: [scoreA, scoreB]
      properties:
        scoreA:
          type: integer
          minimum: 0
        scoreB:
          type: integer
          minimum: 0
    EloHistoryEntry:
      type: object
      required: [id, playerId, matchId, eloBefore, eloAfter, changeAmount, action, createdAt, kUsed, rankBefore, rankAfter, rankMovement, matchesPlayedBefore, matchesPlayedAfter]
      properties:
        id:
          type: integer
        playerId:
          type: integer
        matchId:
          type: integer
        eloBefore:
          type: ["integer", "null"]
        eloAfter:
          type: ["integer", "null"]
        changeAmount:
          type: ["integer", "null"]
        kUsed:
          type: ["integer", "null"]
          enum: [20, 32, 40, 60, null]
          description: Original K used, never recalculated on reversal; null for legacy rows.
        rankBefore:
          $ref: "#/components/schemas/RankLabel"
        rankAfter:
          $ref: "#/components/schemas/RankLabel"
        rankMovement:
          type: ["string", "null"]
          enum: [promotion, demotion, unchanged, null]
          description: Canonical rank-order change; null when hidden or legacy.
        matchesPlayedBefore:
          type: ["integer", "null"]
          minimum: 0
          description: Null if never recorded on a legacy audit.
        matchesPlayedAfter:
          type: ["integer", "null"]
          minimum: 0
        action:
          type: string
          enum: [result, reversal]
        createdAt:
          type: string
          format: date-time
    AuthViewer:
      type: object
      required: [signedIn, isAdmin, userId, email, playerId]
      properties:
        signedIn: {type: boolean}
        isAdmin: {type: boolean}
        userId: {type: ["string", "null"]}
        email: {type: ["string", "null"]}
        playerId: {type: ["integer", "null"]}
    RankLabel:
      type: ["string", "null"]
      description: Derived from ELO, null when hidden or not recorded in legacy history.
      enum: [Iron 3, Iron 2, Iron 1, Bronze 3, Bronze 2, Bronze 1, Silver 3, Silver 2, Silver 1, Gold 3, Gold 2, Gold 1, Platinum 3, Platinum 2, Platinum 1, Diamond 3, Diamond 2, Diamond 1, Masters, null]
    AppAccount:
      type: object
      required: [id, email, isAdmin, playerId]
      properties:
        id: {type: string}
        email: {type: ["string", "null"]}
        isAdmin: {type: boolean}
        playerId: {type: ["integer", "null"]}
    AccountLinkUpdate:
      type: object
      additionalProperties: false
      required: [playerId]
      properties:
        playerId: {type: ["integer", "null"]}
    AdminAccess:
      type: object
      required: [email, bootstrap]
      properties:
        email: {type: string}
        bootstrap: {type: boolean}
    AdminAccessInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: {type: string, format: email}

