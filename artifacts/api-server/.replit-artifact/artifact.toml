kind = "api"
previewPath = "/api"
title = "Volleyball Team Manager API"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "cd ../.. && uv run python main.py"

[services.production]

[services.production.build]
args = ["uv", "sync", "--no-dev"]

[services.production.run]
args = ["uv", "run", "gunicorn", "--bind", "0.0.0.0:8080", "main:app"]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/api/healthz"
