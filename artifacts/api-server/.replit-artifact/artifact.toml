kind = "api"
previewPath = "/api"
title = "Volleyball Team Manager API"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "cd ../.. && uv run python main.py"

[services.production]

[services.production.build]
args = ["sh", "-c", "uv sync --no-dev && pnpm --filter @workspace/api-server run build"]

[services.production.run]
args = ["node", "./artifacts/api-server/dist/auth-gateway.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
