kind = "web"
previewPath = "/"
title = "Wyndham Wombats VC"
description = "The Wyndham Wombats VC club roster, player profiles, public tier leaderboard, and match management."
version = "1.0.0"
id = "artifacts/volleyball-manager"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25476

[services.development]
run = "pnpm --filter @workspace/volleyball-manager run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/volleyball-manager", "run", "build" ]
serve = "static"
publicDir = "artifacts/volleyball-manager/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25476"
BASE_PATH = "/"
